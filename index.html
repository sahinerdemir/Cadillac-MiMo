<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadillac MiMo Hotel | Coming Soon</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="The iconic Cadillac MiMo Hotel is returning soon. Nestled in Miami's historic MiMo District, experience retro-modern luxury reimagined. Sign up for exclusive launch updates.">
  <meta name="keywords" content="Cadillac MiMo Hotel, Miami Modern, MiMo District, Boutique Hotel Miami, Miami Hotel, coming soon">
  
  <!-- Google Fonts for retro-modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Google Maps Iframe -->
  <div class="map-container" id="mapBackground">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7182.766676537302!2d-80.18910472448263!3d25.8239108060315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88d9b3e1ccb9e563%3A0x4a20f0fa8affacaa!2s5201%20Biscayne%20Blvd%2C%20Miami%2C%20FL%2033137!5e0!3m2!1sen!2sus!4v1786844388463!5m2!1sen!2sus" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <div class="map-overlay"></div>
  </div>

  <!-- Foreground Content wrapper -->
  <main class="page-wrapper">
    <div class="glow-backdrop"></div>
    
    <div class="content-container">
      <!-- Logo Section -->
      <div class="logo-wrapper">
        <img src="logo.svg" alt="Cadillac MiMo Hotel Logo" class="hotel-logo" id="hotelLogo">
      </div>



      <!-- Footer Info -->
      <footer class="footer-info">
        <div class="social-links">
          <a href="#" class="social-icon" aria-label="Instagram" id="socialInsta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          </a>
          <a href="#" class="social-icon" aria-label="Facebook" id="socialFb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
          </a>
          <a href="https://maps.google.com/?q=5201+Biscayne+Blvd,+Miami,+FL+33137" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Google Maps Location" id="socialMap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </a>
        </div>
        <p class="address">5201 Biscayne Blvd, Miami, FL 33137</p>
      </footer>
    </div>
  </main>

  <!-- Elegant Dialog Popup -->
  <dialog id="comingSoonDialog" class="coming-soon-dialog">
    <button class="close-btn" id="closeDialogBtn" aria-label="Close dialog">&times;</button>
    <div class="dialog-badge">Cadillac MiMo</div>
    <h2>Coming Soon</h2>
    <p>We are currently shaping our digital home. Follow us for updates as we prepare to welcome you to Miami Modern luxury.</p>
  </dialog>

  <!-- Main JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
